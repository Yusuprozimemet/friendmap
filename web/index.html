<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The posts are public already; the aggregation is what shouldn't be
         searchable. Mirrors the X-Robots-Tag the API sends. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>FriendMap NL</title>

    <!-- Two overlapping map pins: "two people, one place". SVG first, because
         it is one file for every size; the PNGs are the fallback for clients
         that don't take an SVG icon, and 180 is what iOS wants for a home
         screen. All four are generated from one geometry definition so they
         cannot drift — see docs/make_icon.py. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <!-- Matches the app background, so the mobile browser chrome doesn't
         sit against it in a clashing colour. -->
    <meta name="theme-color" content="#FAF6F0" />

    <!-- Inter is served from this origin (see src/index.css). Nothing here
         contacts a third party: no font CDN, no analytics, no pixels — so the
         page makes no request a visitor hasn't asked for, and there is no
         consent banner to need. Preloading the latin subset because it is on
         the critical path for first paint. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
