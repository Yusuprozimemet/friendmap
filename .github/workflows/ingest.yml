name: Daily ingest

# The free path for the daily job. Render's Cron Jobs are a paid feature, so
# this runs the published image here instead and talks to the same database
# over its external URL. If you move to a paid Render plan, delete this file
# and add a Render cron job running the same image with `ingest --days 7`.
#
# Required secrets:
#   INGEST_DATABASE_URL  Render's *External* Postgres URL (the internal one is
#                        only reachable from inside Render's network)
#   NVIDIA_API_KEY       the extractor's LLM key
# Optional: the alert-mail vars, if digests should go out from this run.
on:
  schedule:
    # 06:30 UTC — early enough that the board is fresh for a European morning,
    # and off the top of the hour where GitHub's scheduler queues deepest.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to scrape
        default: "7"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A stuck LLM call shouldn't burn an hour of runner time.
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the daily job
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          DAYS: ${{ inputs.days || '7' }}
        run: |
          docker run --rm \
            -e DATABASE_URL='${{ secrets.INGEST_DATABASE_URL }}' \
            -e NVIDIA_API_KEY='${{ secrets.NVIDIA_API_KEY }}' \
            -e SUBREDDITS='${{ vars.SUBREDDITS || 'makenewfriendsNL,Vriendenmaken' }}' \
            -e MAIL_BACKEND='${{ vars.MAIL_BACKEND || 'console' }}' \
            -e MAIL_FROM='${{ vars.MAIL_FROM }}' \
            -e RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' \
            -e WEB_ORIGIN='${{ vars.WEB_ORIGIN }}' \
            -e SESSION_SECRET='${{ secrets.SESSION_SECRET }}' \
            -e PERSON_KEY_SECRET='${{ secrets.PERSON_KEY_SECRET }}' \
            "$IMAGE" ingest --days "$DAYS"
