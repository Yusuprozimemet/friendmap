name: CI

# Everything that decides whether a commit is good, on every push and PR:
# lint, tests, typecheck, and a container build. On main the same run publishes
# the image to GHCR, which is what Render pulls.
#
# The two quality jobs run in parallel and each own their half end to end
# (lint → test → build) rather than being split into a lint job and a test job:
# the setup step is the expensive part, so paying for it twice per half buys
# nothing but a second cache restore.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Least privilege by default; the image job widens it for itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — lint, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres for the smoke test at the end. The unit tests
    # deliberately don't use it — they run on SQLite, which is why they finish
    # in seconds — but the smoke test has to exercise the real driver path.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: friendmap
          POSTGRES_PASSWORD: friendmap
          POSTGRES_DB: friendmap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U friendmap -d friendmap"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # ../docs holds the helper scripts (icon generator, the repo's
      # no-personal-data check). They live outside backend/ but are still Python
      # this project maintains, so they get linted rather than rotting quietly.
      - name: Lint
        run: ruff check --output-format github . ../docs

      # No DATABASE_URL here on purpose: tests/conftest.py points the engine at
      # a temporary SQLite file, and letting the environment override that would
      # mean the suite quietly ran against the smoke-test database instead.
      - name: Unit tests
        run: pytest

      - name: Schema + seed
        env:
          # Deliberately the bare postgresql:// form a managed host hands out,
          # so a regression in the driver rewrite fails here, not in production.
          DATABASE_URL: postgresql://friendmap:friendmap@localhost:5432/friendmap
        run: python manage.py init-db

      - name: Boot the API and hit it
        env:
          DATABASE_URL: postgresql://friendmap:friendmap@localhost:5432/friendmap
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf http://127.0.0.1:8000/api/stats >/dev/null
          curl -sf http://127.0.0.1:8000/api/profiles >/dev/null
          curl -sf http://127.0.0.1:8000/openapi.json >/dev/null

  web:
    name: web — lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Warnings fail too. react-hooks/exhaustive-deps only ever reports as a
      # warning, and a stale hook dependency shows up as a panel that silently
      # stops updating — nothing in the console, so nobody notices a warning
      # that CI let through.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # `tsc -b && vite build`. Runs after the checks so a type error is
      # reported as a typecheck failure rather than as a build failure.
      - name: Build
        run: npm run build

  image:
    # Static on purpose. An expression here renders as the raw template until
    # the job starts, so a queued or skipped job shows the literal ${{ ... }}
    # in the checks list — and a name that differs between push and PR can't
    # be named as a required status check in branch protection.
    name: image — build & push
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Nothing is pushed from a pull request — a fork PR must not be able to
      # publish an image that Render would then pull. The build still runs, so
      # a broken Dockerfile fails on the PR rather than after merge.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise what was published
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy — nudge Render
    runs-on: ubuntu-latest
    needs: [image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      # Render pulls the image itself; this just tells it a new :latest exists.
      # No hook configured (RENDER_DEPLOY_HOOK_URL unset) is not a failure —
      # the service can be set to deploy on image push instead.
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -sf -X POST "$HOOK" -o /dev/null
          echo "Deploy triggered." >> "$GITHUB_STEP_SUMMARY"